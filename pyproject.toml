[project]
name = "foods-cla-svc"
version = "0.1.0"
description = "AI Food Recognition API using FastAPI, MongoDB, and Ultralytics YOLO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "motor>=3.5.0",
    "ultralytics>=8.4.115",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "db", "models"]

[tool.setuptools.packages.find]
include = ["routes*", "services*"]